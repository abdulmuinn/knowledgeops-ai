name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://knowledgeops:knowledgeops@localhost:5432/knowledgeops

    services:
      postgres:
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_DB: knowledgeops
          POSTGRES_USER: knowledgeops
          POSTGRES_PASSWORD: knowledgeops

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U knowledgeops -d knowledgeops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Run database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run unit tests
        working-directory: backend
        run: python -m pytest -v

      - name: Run integration tests
        working-directory: backend
        run: python -m pytest integration_tests -v

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
