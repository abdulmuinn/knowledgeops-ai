[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeops-backend"
version = "0.1.0"
description = "Backend API for KnowledgeOps AI"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.140,<0.141",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3,<1.0",
    "pypdf>=6,<7",
    "sentence-transformers>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.28,<0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]